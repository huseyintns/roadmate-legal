const sections={"tr_privacy": [{"title": "1. UYGULAMA VE VERİLER", "body": "RoadMate, araç, plaka, yakıt, şarj, bakım, sigorta, gider, belge ve uygulama tercihlerini cihazının yerel depolamasında saklar. Bu sürümde RoadMate hesabı açılması veya bu kayıtların RoadMate'e ait bir sunucuya yüklenmesi gerekmez."}, {"title": "2. KONUM VE HARİTA HİZMETLERİ", "body": "Yakındaki istasyonları aramayı seçersen konum iznin istenir. Arama için cihazının konum koordinatları OpenStreetMap verilerini kullanan üçüncü taraf Overpass hizmetine gönderilir. Park konumu seçerken harita kutucukları OpenStreetMap sunucularından yüklenebilir. Yol tarifi açıldığında Google Haritalar veya seçtiğin harita hizmeti hedef ve bağlantı bilgilerini işleyebilir. Bu hizmetlerin kendi gizlilik kuralları geçerlidir."}, {"title": "3. BELGELER, YEDEKLER VE DESTEK", "body": "Eklediğin belgeler ve oluşturduğun raporlar cihazda işlenir. Yedek veya raporu başka bir uygulamaya kaydetmeyi/paylaşmayı seçersen bilgiler seçtiğin hizmete aktarılabilir. Destek e-postası ancak sen e-posta uygulamasında gönderdiğinde iletilir; gönderdiğin metin ve ekler e-posta sağlayıcılarınca işlenir."}, {"title": "4. BİLDİRİMLER", "body": "Bakım, sigorta ve benzeri hatırlatmalar için cihaz bildirimi izni istenebilir. İzinleri telefon ayarlarından yönetebilirsin."}, {"title": "5. VERİLERİN KONTROLÜ VE SİLİNMESİ", "body": "Kayıtlarını uygulamadan yönetebilir, yedekleyebilir veya Veri yönetimi bölümünden yerel verileri silebilirsin. Uygulamanın kaldırılması yedeklenmeyen kayıtları kaybettirebilir. Başka hizmetlere gönderdiğin veriler için ilgili hizmetin kuralları geçerlidir."}, {"title": "6. DEĞİŞİKLİKLER VE İLETİŞİM", "body": "Özellikler veya veri işleme yöntemleri değişirse bu metin güncellenir. Gizlilik soruları için roadmateapp.support@gmail.com adresine yazabilirsin."}], "tr_terms": [{"title": "1. AMAÇ", "body": "RoadMate, araç bilgilerini ve masraflarını kişisel olarak takip etmeye yardımcı olan bir uygulamadır. Resmî sigorta, muayene, servis veya acil yardım hizmeti değildir."}, {"title": "2. KAYITLAR VE HESAPLAMALAR", "body": "Kullanıcı girdiği tarih, tutar, kilometre ve diğer bilgilerin doğruluğundan sorumludur. Yakıt tüketimi, yolculuk maliyeti, bakım durumu ve mali raporlar kayıtlar üzerinden oluşturulan tahmin veya özetlerdir; teknik arıza teşhisi değildir."}, {"title": "3. HATIRLATMALAR", "body": "Bildirimlerin her zaman veya tam zamanında ulaşacağı garanti edilmez. Önemli süreleri resmî belgelerden ayrıca doğrula."}, {"title": "4. HARİTALAR VE ÜÇÜNCÜ TARAFLAR", "body": "İstasyon bilgileri eksik veya güncel olmayabilir; gösterilen mesafeler kuş uçuşu olabilir. Yol tarifini ve istasyon durumunu yolculuk öncesi doğrula. Harita hizmetleri kendi koşullarına tabidir."}, {"title": "5. YEDEKLEME VE SORUMLULUK", "body": "Verilerini düzenli olarak yedekle. Uygulamayı kaldırmak veya verilerini silmek yedeklenmeyen kayıtları kaybettirebilir. Uygulamayı trafik kurallarına uygun, güvenli şekilde kullan."}, {"title": "6. DESTEK", "body": "Soruların için roadmateapp.support@gmail.com adresine ulaşabilirsin."}], "en_privacy": [{"title": "1. LOCAL DATA", "body": "RoadMate stores vehicle, plate, fuel, charging, maintenance, insurance, expense, document and preference records locally on your device. This version does not require a RoadMate account or upload those records to a RoadMate-operated server."}, {"title": "2. LOCATION AND MAPS", "body": "When you request nearby stations, the app asks for location permission and sends device coordinates to a third-party Overpass service using OpenStreetMap data. Parking maps may load tiles from OpenStreetMap servers. Opening directions may share destination and connection data with Google Maps or your selected map provider. Their own privacy terms apply."}, {"title": "3. DOCUMENTS, BACKUPS AND SUPPORT", "body": "Documents and reports are handled on-device. When you choose to export or share a backup or report, the receiving service may process that data. Support emails are sent only after you choose to send them in your email app; email providers process the message and attachments."}, {"title": "4. NOTIFICATIONS", "body": "Device notification permission may be requested for reminders. You can manage permissions in device settings."}, {"title": "5. CONTROL AND DELETION", "body": "You can manage, back up or delete local data in the app. Unbacked-up records may be lost when the app is removed or its data cleared. Data shared with other services is subject to their policies."}, {"title": "6. UPDATES AND CONTACT", "body": "This policy may change if features or data practices change. Contact roadmateapp.support@gmail.com with privacy questions."}], "en_terms": [{"title": "1. PURPOSE", "body": "RoadMate helps you keep personal vehicle and expense records. It is not an official insurance, inspection, service or emergency-response provider."}, {"title": "2. USER DATA AND ESTIMATES", "body": "You are responsible for the dates, amounts, mileage and details you enter. Fuel, trip, vehicle-maintenance and financial calculations are estimates or summaries based on records, not mechanical diagnostics."}, {"title": "3. REMINDERS", "body": "Delivery or timing of reminders is not guaranteed. Verify important deadlines using official documents."}, {"title": "4. MAP SERVICES", "body": "Station data may be incomplete or outdated, and displayed distances may be straight-line distances. Confirm routes and station status before travelling. Third-party map terms apply."}, {"title": "5. BACKUPS AND SAFE USE", "body": "Back up your records regularly. Removing the app or clearing data may erase unbacked-up records. Use the app safely and obey traffic rules."}, {"title": "6. SUPPORT", "body": "Contact roadmateapp.support@gmail.com."}], "az_privacy": [{"title": "1. YERLİ MƏLUMATLAR", "body": "RoadMate avtomobil, nömrə, yanacaq, şarj, texniki xidmət, sığorta, xərc, sənəd və seçim qeydlərini cihazda saxlayır. Bu versiyada RoadMate hesabı və qeydlərin RoadMate serverinə yüklənməsi tələb edilmir."}, {"title": "2. MƏKAN VƏ XƏRİTƏ", "body": "Yaxınlıqdakı yanacaqdoldurma məntəqələrini axtardıqda məkan icazəsi istənilir və cihazın koordinatları OpenStreetMap məlumatlarından istifadə edən üçüncü tərəf Overpass xidmətinə göndərilir. Park xəritəsi OpenStreetMap serverlərindən xəritə hissələri yükləyə bilər. Marşrut açıldıqda Google Maps və ya seçdiyin xəritə xidməti təyinat və bağlantı məlumatlarını emal edə bilər."}, {"title": "3. SƏNƏDLƏR VƏ DƏSTƏK", "body": "Sənədlər və hesabatlar cihazda işlənir. Ehtiyat nüsxə və ya hesabat paylaşdıqda seçilən xidmət məlumatları emal edə bilər. Dəstək mesajı yalnız e-poçt tətbiqində göndərdiyin zaman ötürülür."}, {"title": "4. BİLDİRİŞLƏR", "body": "Xatırlatmalar üçün cihaz bildiriş icazəsi istənilə bilər. İcazələri cihaz ayarlarında idarə edə bilərsən."}, {"title": "5. SİLMƏ VƏ NƏZARƏT", "body": "Qeydləri tətbiqdən idarə edə, ehtiyat nüsxə yarada və ya yerli məlumatları silə bilərsən. Yedəklənməmiş qeydlər tətbiq silindikdə itə bilər."}, {"title": "6. ƏLAQƏ", "body": "Məxfilik sualları üçün roadmateapp.support@gmail.com ünvanına yaz."}], "az_terms": [{"title": "1. MƏQSƏD", "body": "RoadMate şəxsi avtomobil və xərc qeydlərini izləmək üçün köməkçi tətbiqdir. Rəsmi sığorta, texniki baxış, servis və ya təcili yardım xidməti deyil."}, {"title": "2. QEYDLƏR VƏ HESABLAMALAR", "body": "Daxil edilən tarix, məbləğ və yürüş məlumatlarının düzgünlüyünə istifadəçi cavabdehdir. Yanacaq, səfər xərci, texniki xidmət və maliyyə nəticələri təxmini hesablamalardır; texniki nasazlıq diaqnozu deyil."}, {"title": "3. XATIRLATMALAR", "body": "Bildirişlərin vaxtında çatmasına zəmanət verilmir. Vacib tarixləri rəsmi sənədlərlə yoxla."}, {"title": "4. XƏRİTƏ XİDMƏTLƏRİ", "body": "Yanacaqdoldurma məntəqələri haqqında məlumat köhnə və ya natamam ola bilər. Məsafələr düz xətt üzrə göstərilə bilər. Marşrutu yoxla."}, {"title": "5. EHTİYAT NÜSXƏ VƏ TƏHLÜKƏSİZLİK", "body": "Məlumatlarını mütəmadi yedəklə. Tətbiqi silmək yedəklənməmiş qeydləri itirə bilər. Yol hərəkəti qaydalarına əməl et."}, {"title": "6. DƏSTƏK", "body": "roadmateapp.support@gmail.com ünvanına yaz."}]};
const ui={tr:{privacy:'Gizlilik Politikası',terms:'Kullanım Koşulları',support:'Destek ve İletişim',updated:'Son güncelleme: 02.11.2026',tag:'Yasal Bilgiler ve Destek',help:'Uygulama içindeki Destek ve Bilgiler bölümünden e-posta oluşturabilirsiniz. Mesajı göndermeden önce içeriği kontrol edin.',email:'E-posta'},en:{privacy:'Privacy Policy',terms:'Terms of Use',support:'Support & Contact',updated:'Last updated: 02 November 2026',tag:'Legal Information & Support',help:'You can compose an email from Support & Information in the app. Review your message before sending.',email:'Email'},az:{privacy:'Məxfilik Siyasəti',terms:'İstifadə Şərtləri',support:'Dəstək və Əlaqə',updated:'Son yenilənmə: 02.11.2026',tag:'Hüquqi Məlumat və Dəstək',help:'Tətbiqdəki Dəstək və Məlumat bölməsindən e-poçt hazırlaya bilərsiniz. Göndərməzdən əvvəl mesajı yoxlayın.',email:'E-poçt'}};
let lang='tr',tab='privacy';const el=id=>document.getElementById(id);
function render(){document.documentElement.lang=lang;el('language').value=lang;for(const name of ['privacy','terms','support']){const b=el(name+'Tab');b.textContent=ui[lang][name];b.classList.toggle('active',tab===name);b.setAttribute('aria-current',tab===name?'page':'false')}el('tagline').textContent=ui[lang].tag;el('heading').textContent=ui[lang][tab];el('updated').textContent=tab==='support'?'':ui[lang].updated;el('content').replaceChildren();if(tab==='support'){const p=document.createElement('p');p.textContent=ui[lang].help;el('content').append(p);const d=document.createElement('div');d.className='support';const strong=document.createElement('strong');strong.textContent=ui[lang].email+': ';const a=document.createElement('a');a.href='mailto:roadmateapp.support@gmail.com';a.textContent='roadmateapp.support@gmail.com';d.append(strong,a);el('content').append(d)}else{for(const sec of sections[lang+'_'+tab]){const h=document.createElement('h3');h.textContent=sec.title;const p=document.createElement('p');p.textContent=sec.body;el('content').append(h,p)}}document.title='RoadMate | '+ui[lang][tab]}
function navigate(){const h=location.hash.slice(1).toLowerCase();const parts=h.split('-');if(['privacy','terms','support'].includes(parts[0]))tab=parts[0];if(['tr','en','az'].includes(parts[1]))lang=parts[1];render()}
for(const name of ['privacy','terms','support'])el(name+'Tab').addEventListener('click',()=>{location.hash=name+'-'+lang;navigate()});el('language').addEventListener('change',e=>{lang=e.target.value;location.hash=tab+'-'+lang;navigate()});window.addEventListener('hashchange',navigate);navigate();
</script></body></html>
